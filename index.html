<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Title, description and link preview (Open Graph), written by the build from es.json (src/seo/site.ts). -->
    <!-- seo-head -->
    <!-- Installable app (ADR 0018). Relative URLs: the same build works at the site root and under a subpath. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Favicon: SVG where supported (it follows the dark theme), PNG and ICO for the rest. sizes="32x32"
         on the ICO keeps browsers that read SVG from picking it instead. -->
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DT.es" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f5ed" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16120e" />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <noscript>Esta aplicación necesita JavaScript. Funciona sin conexión y no envía datos.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
