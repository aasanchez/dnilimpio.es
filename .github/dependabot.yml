# Dependabot version updates: one pull request per group, every Wednesday at 16:00 Madrid time,
# the same slot as the dependency check (.github/workflows/deps-check.yml).
# Each pull request runs the full CI; nothing merges without review (Squash and merge).
# Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # The app: package.json and pnpm-lock.yaml at the root (pnpm uses the npm ecosystem).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "16:00"
      timezone: "Europe/Madrid"
    # Wait a week after a release before proposing it: most compromised releases are found and
    # pulled within days.
    cooldown:
      default-days: 7
    # Keep the exact pins (savePrefix "" in pnpm-workspace.yaml).
    versioning-strategy: increase
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      app-minor-patch:
        update-types: ["minor", "patch"]

  # The deploy tool (wrangler), installed only by the CI deploy job.
  - package-ecosystem: "npm"
    directory: "/deploy"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "16:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      deploy-minor-patch:
        update-types: ["minor", "patch"]

  # Actions in the workflows and in the shared setup action. Dependabot keeps the SHA pins and
  # updates the version comment.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "16:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
