# SPDX-License-Identifier: AGPL-3.0-or-later
# Shared setup for every CI job that needs the project's dependencies:
# Node from .nvmrc and the exact pnpm from package.json "packageManager", then node_modules.
#
# Caching, fastest first:
# 1. node_modules itself, keyed on everything that decides its content (Node version, lockfile,
#    package.json, pnpm settings). A hit skips `pnpm install` entirely.
# 2. On a miss, the pnpm store, so the install downloads only what changed.
# Only the `install` job saves caches (save-cache: 'true'); the other jobs only restore them, so
# parallel jobs never race to write the same cache entry.
# Optionally one Playwright browser, cached by Playwright version: Chromium's headless shell (smaller
# than full Chromium) by default, or Firefox or WebKit for the cross-browser e2e job.
name: Setup project
description: Node, pnpm, cached node_modules and (optionally) one Playwright browser

inputs:
  save-cache:
    description: "'true' to save the node_modules and pnpm store caches (the install job only)"
    default: 'false'
  playwright:
    description: "'true' to install a Playwright browser and its system libraries"
    default: 'false'
  browser:
    description: "The Playwright browser to install: 'chromium' (headless shell only), 'firefox' or 'webkit'"
    default: 'chromium'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    # Exact pnpm version from package.json "packageManager", installed with the npm that ships with
    # Node, so no third-party setup action is needed. Install scripts are disabled.
    - name: Install pnpm
      shell: bash
      run: npm install --global --ignore-scripts "$(node -p "require('./package.json').packageManager")"

    - id: modules
      name: Restore node_modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

    - if: steps.modules.outputs.cache-hit != 'true'
      id: store
      name: Locate pnpm store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - if: steps.modules.outputs.cache-hit != 'true' && inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - if: steps.modules.outputs.cache-hit != 'true' && inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - if: steps.modules.outputs.cache-hit != 'true'
      name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - if: steps.modules.outputs.cache-hit != 'true' && inputs.save-cache == 'true'
      name: Save node_modules
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}

    # Browser version comes from the exact @playwright/test pin in pnpm-lock.yaml.
    - if: inputs.playwright == 'true'
      id: pw
      name: Read Playwright version
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - if: inputs.playwright == 'true'
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browser == 'chromium' && 'chromium-headless-shell' || inputs.browser }}

    # Headless Chromium tests only need its headless shell (--only-shell), a smaller download.
    # Cache hit: the browser is there, only the system libraries (not cacheable) are installed.
    - if: inputs.playwright == 'true'
      name: Install Playwright ${{ inputs.browser }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        BROWSER: ${{ inputs.browser }}
      run: |
        case "$BROWSER" in chromium|firefox|webkit) ;; *) echo "Unknown browser: $BROWSER"; exit 1 ;; esac
        if [ "$CACHE_HIT" = 'true' ]; then
          pnpm exec playwright install-deps "$BROWSER"
        elif [ "$BROWSER" = 'chromium' ]; then
          pnpm exec playwright install --with-deps --only-shell chromium
        else
          pnpm exec playwright install --with-deps "$BROWSER"
        fi
