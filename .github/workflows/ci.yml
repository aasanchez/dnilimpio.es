# SPDX-License-Identifier: AGPL-3.0-or-later
# CI pipeline, split into small jobs. Stages are logical (GitHub Actions has no stages): a job starts
# as soon as the jobs in its `needs:` pass, so independent checks run in parallel.
#
#   changes ─ install ─┬─ build ──────┬─ e2e (2 shards) ─┐
#                      ├─ typecheck   ├─ bundle-size     │
#                      ├─ lint        └─ lighthouse      │
#                      └─ unit                           ├─ ci-ok ─ deploy ─ smoke
#   reuse · audit · dependency-review · workflow-lint ───┘   (master only)
#
# ci-ok is the one status check that branch protection requires. CodeQL runs in codeql.yml.
# Deploy: on master (push or manual run), publishes the dist/ that passed every check to GitHub Pages.
# Never re-run the legacy "pages build and deployment" workflow: it publishes unbuilt source.
# Actions are pinned to full commit SHAs; the comment gives the release tag.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  # ── Stage 0: changes ────────────────────────────────────────────────────────────────────────────
  # On a pull request that only touches documentation, the code jobs are skipped (ci-ok still passes).
  # On master and manual runs everything runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSES/**'

  # ── Stage 1: setup ──────────────────────────────────────────────────────────────────────────────
  install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: 'true'

  # ── Stage 2: build ──────────────────────────────────────────────────────────────────────────────
  build:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The one build every later job tests, measures and deploys.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  typecheck:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  unit:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total
            const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct} % | ${t[k].covered} / ${t[k].total} |`)
            console.log(["### Unit test coverage", "", "| Metric | Covered | Count |", "|---|---:|---:|", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Stage 3: test ───────────────────────────────────────────────────────────────────────────────
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: e2e (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm test:e2e --shard="$SHARD/2"
        env:
          SHARD: ${{ matrix.shard }}

  bundle-size:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Warns when over budget. Add --strict to make it block.
      - run: node scripts/bundle-size.ts

  # ── Stage 4: code analysis and supply chain ─────────────────────────────────────────────────────
  # These need no build, so they start at once and run alongside everything else.
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global --ignore-scripts "$(node -p "require('./package.json').packageManager")"
      # Known vulnerabilities (high or critical) in the dependencies that ship to the browser.
      - run: pnpm audit --prod --audit-level high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Blocks a PR that adds a dependency with a known moderate-or-worse vulnerability.
          fail-on-severity: moderate

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint: syntax, expressions and shell scripts in the workflows.
      - name: actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      # zizmor: security audit of the workflows (injection, permissions, unpinned actions).
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          advanced-security: false
          annotations: true

  # ── Stage 5: acceptance ─────────────────────────────────────────────────────────────────────────
  lighthouse:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Thresholds in lighthouserc.json are warnings for now. Reports are kept as a workflow artifact
      # only: nothing is uploaded to a public server.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  # ── Stage 6: gate ───────────────────────────────────────────────────────────────────────────────
  # The single required status check. Passes when every job passed or was skipped on purpose.
  ci-ok:
    if: always()
    needs: [changes, install, build, typecheck, lint, unit, e2e, bundle-size, reuse, audit, dependency-review, workflow-lint, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e 'const n = JSON.parse(require("fs").readFileSync(0, "utf8")); for (const [job, r] of Object.entries(n)) console.log(`${r.result.padEnd(9)} ${job}`)'
          test "$FAILED" = 'false'

  # ── Stage 7: deploy (master only) ───────────────────────────────────────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: [ci-ok, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment in progress; queue the next one instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # ── Stage 8: post-deploy ────────────────────────────────────────────────────────────────────────
  # The live site must serve this commit's build, with matching SRI hashes (scripts/smoke.ts).
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/smoke.ts "$PAGE_URL" "$GITHUB_SHA"
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
