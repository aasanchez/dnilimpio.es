# SPDX-License-Identifier: AGPL-3.0-or-later
# CI pipeline, split into small jobs. Stages are logical (GitHub Actions has no stages): a job starts
# as soon as the jobs in its `needs:` pass, so independent checks run in parallel.
#
# Pull request: validate everything, never deploy.
#
#   changes ─ install ─┬─ build ──────┬─ e2e (2 shards) ─┐
#                      ├─ typecheck   ├─ bundle-size     │
#                      ├─ lint        ├─ reproducible    │
#                      │              └─ lighthouse      │
#                      └─ unit                           ├─ ci-ok
#   reuse · audit · dependency-review · workflow-lint ───┘
#
# master (push or manual run): the code was validated on its pull request (squash merge of a branch
# that branch protection requires to be up to date), so it is not validated again. Build, deploy, and
# check the live site:
#
#                                     ┌─ deploy (GitHub Pages) ─┬─ smoke ─ lighthouse-live
#   changes ─ install ─ build ─ ci-ok ─┤                         └─ attest (build provenance)
#                                     └─ deploy-cloudflare (dnitapado.es) ─ smoke-cloudflare
#
# dnitapado.es is served by Cloudflare Workers, which sends the HTTP security headers of
# scripts/headers.ts (ADR 0027). The same build also goes to GitHub Pages, which sends no headers and
# keeps the old address https://aasanchez.github.io/dnilimpio.es/ working.
#
# ci-ok is the one status check that branch protection requires. CodeQL runs in codeql.yml.
# Never re-run the legacy "pages build and deployment" workflow: it publishes unbuilt source.
# Actions are pinned to full commit SHAs; the comment gives the release tag.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  # ── Stage 0: changes ────────────────────────────────────────────────────────────────────────────
  # Decides what this run does:
  # - release: master (push or manual run). Build and deploy only.
  # - build: install and build are needed (release, or a validation run that touches code).
  # - validate: run the checks. Pull requests and manual runs on other branches. On a pull request that
  #   only touches documentation, the code checks are skipped (ci-ok still passes).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.mode.outputs.release }}
      build: ${{ steps.mode.outputs.release == 'true' || steps.mode.outputs.code == 'true' }}
      validate: ${{ steps.mode.outputs.release != 'true' && steps.mode.outputs.code == 'true' }}
      checks: ${{ steps.mode.outputs.release != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSES/**'
      - id: mode
        env:
          RELEASE: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          CODE: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: |
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE code=$CODE"

  # ── Stage 1: setup ──────────────────────────────────────────────────────────────────────────────
  install:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: 'true'

  # ── Stage 2: build ──────────────────────────────────────────────────────────────────────────────
  build:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Reproducible: the build time is the commit's time, not the clock (vite.config.ts), so any
      # rebuild of this commit gives the same bytes (checked by the `reproducible` job).
      - name: Fix the build time to the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: pnpm build
      # Software bill of materials of the runtime dependencies (CycloneDX), kept with the run.
      - run: pnpm sbom --sbom-format cyclonedx --sbom-type application --prod --out sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
      # The one build every later job tests, measures and deploys.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  typecheck:
    needs: [changes, install]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    needs: [changes, install]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  unit:
    needs: [changes, install]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Unit test coverage'
            echo
            echo '| Metric | Covered | Count |'
            echo '|---|---:|---:|'
            jq -r '.total | to_entries[] | select(.key | IN("lines", "statements", "functions", "branches")) | "| \(.key) | \(.value.pct) % | \(.value.covered) / \(.value.total) |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Stage 3: test ───────────────────────────────────────────────────────────────────────────────
  e2e:
    needs: [changes, build]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: e2e (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm test:e2e --shard="$SHARD/2"
        env:
          SHARD: ${{ matrix.shard }}

  bundle-size:
    needs: [changes, build]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Warns when over budget. Add --strict to make it block.
      - run: node scripts/bundle-size.ts

  # Builds the same commit again on a fresh runner and compares every file with the `dist` artifact.
  # They must be identical: the deployed site can be rebuilt from source and checked (ADR 0013).
  reproducible:
    needs: [changes, build]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fix the build time to the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: pnpm build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist-ci/
      - name: Compare with the build that is tested and deployed
        run: diff -u <(node scripts/build-manifest.ts dist-ci) <(node scripts/build-manifest.ts dist)

  # ── Stage 4: code analysis and supply chain ─────────────────────────────────────────────────────
  # These need no build, so they start right after `changes` and run alongside everything else.
  reuse:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  audit:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global --ignore-scripts "$(node -p "require('./package.json').packageManager")"
      # Known vulnerabilities (high or critical) in the dependencies that ship to the browser.
      - run: pnpm audit --prod --audit-level high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Blocks a PR that adds a dependency with a known moderate-or-worse vulnerability.
          fail-on-severity: moderate

  workflow-lint:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint: syntax, expressions and shell scripts in the workflows.
      - name: actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      # zizmor: security audit of the workflows (injection, permissions, unpinned actions).
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          advanced-security: false
          annotations: true

  # ── Stage 5: acceptance ─────────────────────────────────────────────────────────────────────────
  lighthouse:
    needs: [changes, build]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Thresholds in lighthouserc.json are warnings for now. Reports are kept as a workflow artifact
      # only: nothing is uploaded to a public server.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  # ── Stage 6: gate ───────────────────────────────────────────────────────────────────────────────
  # The single required status check. Passes when every job passed or was skipped on purpose.
  ci-ok:
    if: always()
    needs: [changes, install, build, typecheck, lint, unit, e2e, bundle-size, reproducible, reuse, audit, dependency-review, workflow-lint, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          test "$FAILED" = 'false'

  # ── Stage 7: deploy (master only) ───────────────────────────────────────────────────────────────
  # An `if:` without a status function means success() of every job upstream, including jobs skipped on
  # purpose (dependency-review on a push), which would skip the deploy. So the results are checked here.
  deploy:
    # Only master: a push to master or a manual run on master. Never a pull request or another branch.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.release == 'true' && needs.ci-ok.result == 'success' && needs.build.result == 'success' }}
    needs: [changes, ci-ok, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment in progress; queue the next one instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The same tested build, with the `_headers` file of scripts/headers.ts, to Cloudflare Workers
  # (wrangler.jsonc, ADR 0027). wrangler comes from deploy/pnpm-lock.yaml, installed without install
  # scripts. The API token lives in the `cloudflare` environment, which only master may use.
  deploy-cloudflare:
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.release == 'true' && needs.ci-ok.result == 'success' && needs.build.result == 'success' }}
    needs: [changes, ci-ok, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare
      url: https://dnitapado.es/
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global --ignore-scripts "$(node -p "require('./package.json').packageManager")"
      - name: Install the deploy tool
        working-directory: deploy
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Write the host headers
        run: node scripts/headers.ts dist
      - name: Deploy
        run: deploy/node_modules/.bin/wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

  # Signed build provenance (SLSA, via GitHub's attestation service) for every deployed file: anyone can
  # check that a file came from this repository, this workflow and this commit, with
  # `gh attestation verify <file> --repo aasanchez/dnilimpio.es`.
  attest:
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**'

  # ── Stage 8: post-deploy ────────────────────────────────────────────────────────────────────────
  # The live site must serve exactly this run's build: exact CSP, SRI, every file of the service
  # worker's manifest, and every file of the dist artifact byte for byte (scripts/smoke.ts).
  smoke:
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The artifact this run built and deployed: every live file must match it byte for byte.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: node scripts/smoke.ts "$PAGE_URL" "$GITHUB_SHA" dist
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}

  # dnitapado.es must serve exactly this build, and the exact HTTP headers of scripts/headers.ts.
  smoke-cloudflare:
    if: ${{ !cancelled() && needs.deploy-cloudflare.result == 'success' }}
    needs: deploy-cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: node scripts/smoke.ts https://dnitapado.es/ "$GITHUB_SHA" dist
        env:
          SMOKE_HOST_HEADERS: '1'

  # Lighthouse on the live site, once smoke has confirmed it serves this build. Real hosting (GitHub
  # Pages: compression, cache headers, HTTP/2). Thresholds in lighthouserc.live.json, warnings only.
  lighthouse-live:
    if: ${{ !cancelled() && needs.smoke.result == 'success' }}
    needs: [deploy, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: ${{ needs.deploy.outputs.page_url }}
          configPath: ./lighthouserc.live.json
          uploadArtifacts: true
          temporaryPublicStorage: false
