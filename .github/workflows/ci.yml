# SPDX-License-Identifier: AGPL-3.0-or-later
# CI pipeline, split into small jobs. Stages are logical (GitHub Actions has no stages): a job starts
# as soon as the jobs in its `needs:` pass, so independent checks run in parallel.
#
# Pull request: validate everything, never deploy.
#
#   changes ─ install ─┬─ build ──────┬─ e2e (4 shards) ─┐
#                      │              ├─ e2e (firefox, webkit)
#                      ├─ typecheck   ├─ bundle-size     │
#                      ├─ lint        ├─ reproducible    │
#                      │              └─ lighthouse      │
#                      └─ unit                           ├─ ci-ok
#   reuse · audit · dependency-review · workflow-lint ───┘
#
# master (push or manual run): the code was validated on its pull request (rebase or squash merge of
# a branch that branch protection requires to be up to date), so it is not validated again. Build, deploy, and
# check the live site:
#
#   changes ─ install ─ build ─ reproducible ─ ci-ok ─ deploy (dnitapado.es) ─┬─ smoke ─ lighthouse-live
#                                                                             ├─ attest ─ verify-provenance
#                                                                             └─ release (tag, GitHub Release)
#
# The release commit is a new commit (both merge methods rewrite it), so it is rebuilt and compared once more before
# it deploys, and its provenance is signed, then checked with a pinned identity.
#
# dnitapado.es is served by Cloudflare Workers, the only host, which sends the HTTP security headers
# of scripts/headers.ts (ADR 0027). Nothing is deployed to GitHub Pages any more: the old address
# https://aasanchez.github.io/dnilimpio.es/ only redirects to dnitapado.es.
#
# ci-ok is the one status check that branch protection requires. CodeQL runs in codeql.yml.
# Never re-run the legacy "pages build and deployment" workflow: it publishes unbuilt source.
# Actions are pinned to full commit SHAs; the comment gives the release tag.
#
# Releases (ADR 0032): `changes` computes the version from the git tags (scripts/release-version.ts):
# the patch of the highest vMAJOR.MINOR.PATCH tag on master plus one, v1.0.0 when there is no tag.
# Alexis sets major and minor by hand, by pushing a tag such as v1.5.0. The build carries the version
# (footer). Once `deploy` succeeds, `release` creates the tag on the commit and its GitHub Release.
# Runs on master never overlap (`concurrency` below), so each run sees the tag of the run before it.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  # ── Stage 0: changes ────────────────────────────────────────────────────────────────────────────
  # Decides what this run does:
  # - release: master (push or manual run). Build and deploy only.
  # - build: install and build are needed (release, or a validation run that touches code).
  # - validate: run the checks. Pull requests and manual runs on other branches. On a pull request that
  #   only touches documentation, the code checks are skipped (ci-ok still passes).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.mode.outputs.release }}
      # The version this commit's build carries, such as 1.4.8, and its tag, v1.4.8 (ADR 0032).
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.mode.outputs.release == 'true' || steps.mode.outputs.code == 'true' }}
      validate: ${{ steps.mode.outputs.release != 'true' && steps.mode.outputs.code == 'true' }}
      checks: ${{ steps.mode.outputs.release != 'true' }}
    steps:
      # The whole history with its tags: the version comes from the tags reachable from this commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSES/**'
      - id: mode
        env:
          RELEASE: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          CODE: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: |
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE code=$CODE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # On a pull request this is the version the change would get if it merged now; it is never
      # tagged. On master it is the version that deploys and that `release` tags.
      - id: version
        run: node scripts/release-version.ts | tee -a "$GITHUB_OUTPUT"

  # ── Stage 1: setup ──────────────────────────────────────────────────────────────────────────────
  install:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: 'true'

  # ── Stage 2: build ──────────────────────────────────────────────────────────────────────────────
  build:
    needs: [changes, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Reproducible: the build time is the commit's time, not the clock (vite.config.ts), so any
      # rebuild of this commit gives the same bytes (checked by the `reproducible` job).
      - name: Fix the build time to the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # The release version goes into the footer (ADR 0032). `reproducible` builds with the same value.
      - run: pnpm build
        env:
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
      # Software bill of materials of the runtime dependencies (CycloneDX), kept with the run.
      - run: pnpm sbom --sbom-format cyclonedx --sbom-type application --prod --out sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
      # Hash evidence of this build: the SHA-384 of every file, the commit and the SBOM. On master it is
      # attested with the deployed files (`attest`), so the evidence of each release is signed and kept
      # by GitHub's attestation service, and kept as a workflow artifact for 90 days.
      - name: Write the release evidence
        env:
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
        run: |
          mkdir release-evidence
          node scripts/build-manifest.ts dist > release-evidence/files.sha384.txt
          echo "$GITHUB_SHA" > release-evidence/commit.txt
          echo "$RELEASE_VERSION" > release-evidence/version.txt
          cp sbom.cdx.json release-evidence/
          {
            echo '### Build evidence'
            echo
            echo "Version $RELEASE_VERSION, commit \`$GITHUB_SHA\`, $(wc -l < release-evidence/files.sha384.txt) files."
            echo "SHA-384 of the file list: \`$(sha384sum release-evidence/files.sha384.txt | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 90
          if-no-files-found: error
      # The one build every later job tests, measures and deploys.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  typecheck:
    needs: [changes, install]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    needs: [changes, install]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  unit:
    needs: [changes, install]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Unit test coverage'
            echo
            echo '| Metric | Covered | Count |'
            echo '|---|---:|---:|'
            jq -r '.total | to_entries[] | select(.key | IN("lines", "statements", "functions", "branches")) | "| \(.key) | \(.value.pct) % | \(.value.covered) / \(.value.total) |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Stage 3: test ───────────────────────────────────────────────────────────────────────────────
  e2e:
    needs: [changes, build]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Four shards: each one runs about a quarter of the tests (fullyParallel in playwright.config.ts
    # splits by test, not by file). Setup takes ~25 s per shard, so more shards would gain little.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm test:e2e --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
          # The version the build carries, for tests/e2e/version.spec.ts.
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}

  # The privacy, security, cleanup, export, offline and front-only specs in Firefox and WebKit
  # (Safari's engine): CROSS_BROWSER_SPECS in playwright.config.ts. One job per browser, in parallel
  # with the Chromium shards.
  e2e-browsers:
    needs: [changes, build]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    name: e2e (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
          browser: ${{ matrix.browser }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm exec playwright test --project="$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}

  # Screenshot comparisons (tests/e2e/visual.spec.ts) inside the official Playwright image, pinned by
  # digest: the same browser build and system fonts as `pnpm test:visual` on any machine, so the
  # baselines in tests/e2e/__screenshots__/ match. Keep the image in sync with scripts/visual.sh and
  # @playwright/test. On a difference, the `visual-diff` artifact holds expected, actual and diff.
  visual:
    needs: [changes, build]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm exec playwright test
        env:
          VISUAL: '1'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  bundle-size:
    needs: [changes, build]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Warns when over budget. Add --strict to make it block.
      - run: node scripts/bundle-size.ts

  # Builds the same commit again on a fresh runner and compares every file with the `dist` artifact.
  # They must be identical: the deployed site can be rebuilt from source and checked (ADR 0013).
  # Runs on pull requests and on the release commit itself: the merge makes a new commit, so the
  # check on the pull request says nothing about the commit that deploys. Deploy waits for it.
  reproducible:
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fix the build time to the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: pnpm build
        env:
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist-ci/
      - name: Compare with the build that is tested and deployed
        run: diff -u <(node scripts/build-manifest.ts dist-ci) <(node scripts/build-manifest.ts dist)

  # ── Stage 4: code analysis and supply chain ─────────────────────────────────────────────────────
  # These need no build, so they start right after `changes` and run alongside everything else.
  reuse:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  audit:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global --ignore-scripts "$(node -p "require('./package.json').packageManager")"
      # Known vulnerabilities (high or critical) in the dependencies that ship to the browser.
      - run: pnpm audit --prod --audit-level high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Blocks a PR that adds a dependency with a known moderate-or-worse vulnerability.
          fail-on-severity: moderate

  workflow-lint:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint: syntax, expressions and shell scripts in the workflows.
      - name: actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      # zizmor: security audit of the workflows (injection, permissions, unpinned actions).
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          advanced-security: false
          annotations: true

  # ── Stage 5: acceptance ─────────────────────────────────────────────────────────────────────────
  lighthouse:
    needs: [changes, build]
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Thresholds in lighthouserc.json are warnings for now. Reports are kept as a workflow artifact
      # only: nothing is uploaded to a public server.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  # ── Stage 6: gate ───────────────────────────────────────────────────────────────────────────────
  # The single required status check. Passes when every job passed or was skipped on purpose.
  ci-ok:
    if: always()
    needs: [changes, install, build, typecheck, lint, unit, e2e, e2e-browsers, visual, bundle-size, reproducible, reuse, audit, dependency-review, workflow-lint, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          test "$FAILED" = 'false'

  # ── Stage 7: deploy (master only) ───────────────────────────────────────────────────────────────
  # The tested build, with the `_headers` file of scripts/headers.ts, to Cloudflare Workers
  # (wrangler.jsonc, ADR 0027). wrangler comes from deploy/pnpm-lock.yaml, installed without install
  # scripts. The API token lives in the `cloudflare` environment, which only master may use.
  # An `if:` without a status function means success() of every job upstream, including jobs skipped on
  # purpose (dependency-review on a push), which would skip the deploy. So the results are checked here.
  deploy:
    # Only master: a push to master or a manual run on master. Never a pull request or another branch.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.release == 'true' && needs.ci-ok.result == 'success' && needs.build.result == 'success' && needs.reproducible.result == 'success' }}
    needs: [changes, ci-ok, build, reproducible]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare
      url: https://dnitapado.es/
    # Never cancel a deployment in progress; queue the next one instead.
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global --ignore-scripts "$(node -p "require('./package.json').packageManager")"
      - name: Install the deploy tool
        working-directory: deploy
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Write the host headers
        run: node scripts/headers.ts dist
      - name: Deploy
        run: deploy/node_modules/.bin/wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

  # Signed build provenance (SLSA, via GitHub's attestation service) for every deployed file and for the
  # release evidence: anyone can check that a file came from this repository, this workflow, master and
  # this commit, with `node scripts/verify-release.ts <dir> <commit>` (pinned identity, see below).
  attest:
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: release-evidence/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/**
            release-evidence/**

  # Checks the signatures `attest` just made, the way a third party would: every deployed file and the
  # release evidence must carry provenance signed by GitHub for this repository, the CI workflow, master
  # and this commit, on a GitHub-hosted runner (scripts/verify-release.ts). gh checks the signatures
  # against GitHub's Sigstore trust root; it does not trust this run's word for it.
  verify-provenance:
    if: ${{ !cancelled() && needs.attest.result == 'success' }}
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: release-evidence/
      # The evidence must describe exactly the files that were deployed.
      - run: diff -u release-evidence/files.sha384.txt <(node scripts/build-manifest.ts dist)
      - run: node scripts/verify-release.ts dist "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/verify-release.ts release-evidence "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

  # ── Stage 8: post-deploy ────────────────────────────────────────────────────────────────────────
  # The live site must serve exactly this run's build: exact CSP, SRI, every file of the service
  # worker's manifest, and every file of the dist artifact byte for byte (scripts/smoke.ts).
  # It must also send the exact HTTP headers of scripts/headers.ts, and set no cookie.
  smoke:
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: node scripts/smoke.ts https://dnitapado.es/ "$GITHUB_SHA" dist
        env:
          SMOKE_HOST_HEADERS: '1'

  # Lighthouse on the live site, once smoke has confirmed it serves this build. Real hosting
  # (Cloudflare: compression, cache headers, HTTP/2). Thresholds in lighthouserc.live.json, warnings only.
  lighthouse-live:
    if: ${{ !cancelled() && needs.smoke.result == 'success' }}
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: https://dnitapado.es/
          configPath: ./lighthouserc.live.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  # ── Stage 9: release (master only) ──────────────────────────────────────────────────────────────
  # Once the deploy succeeded, tags the commit with the version its build carries and publishes a
  # GitHub Release, with the release evidence attached (ADR 0032). The tag means "this build was
  # deployed". It runs beside smoke and attest; a failing smoke still shows on the run.
  # Safe to run again: a tag that already points at this commit is kept, and an existing release is
  # left as it is. A tag with this name on another commit fails the job and changes nothing.
  # If this job fails, re-run it before the next merge, or the next commit gets the same version.
  release:
    if: ${{ !cancelled() && needs.changes.outputs.release == 'true' && needs.deploy.result == 'success' }}
    needs: [changes, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: release-evidence/
      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.changes.outputs.tag }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version tag: '$TAG'"; exit 1; }
          # The build must carry exactly this version.
          test "$(cat release-evidence/version.txt)" = "$VERSION"
          # The commit the tag points at, if the tag exists (annotated tags point at a tag object).
          target=''
          if ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            read -r type sha <<< "$ref"
            if [ "$type" = tag ]; then sha=$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha); fi
            target=$sha
          fi
          if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG already exists on $target, not on $GITHUB_SHA"
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            # Creates the tag on this commit when it does not exist yet.
            gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "$TAG" \
              --notes "Deployed build of commit $GITHUB_SHA. The attached release evidence lists the SHA-384 of every deployed file; see the README, \"Check that the live files are the ones built from this repository\"." \
              --generate-notes --latest \
              release-evidence/files.sha384.txt release-evidence/commit.txt release-evidence/version.txt release-evidence/sbom.cdx.json
          fi
          echo "### Release [$TAG](https://github.com/$REPO/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
