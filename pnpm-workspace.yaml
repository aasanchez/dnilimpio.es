# pnpm settings for this single-package project (no workspace packages).
# Dependency versions are pinned exactly; no dependency may run install scripts.
savePrefix: ""
strictDepBuilds: true
onlyBuiltDependencies: []
# tesseract.js only runs `opencollective-postinstall` (a funding message); it is not needed.
allowBuilds:
  tesseract.js: false
