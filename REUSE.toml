# SPDX-License-Identifier: AGPL-3.0-or-later
# Copyright and licence for every file (checked by `reuse lint`, CI job `reuse`).
version = 1

# Default for the whole repository: a file's own SPDX-License-Identifier header comes first; the
# copyright line and, for files that cannot carry a header (JSON, images), the licence come from here.
# Later annotations override this one for the files they match.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "dnitapado.es contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Files that cannot carry a comment header (JSON, binary fixtures).

[[annotations]]
path = ["src/i18n/locales/*.json", "src/guide/locales/*.json", "lighthouserc.json", "lighthouserc.live.json", "tests/fixtures/**", "tests/e2e/__screenshots__/**", "docs/images/**", "public/manifest.webmanifest", "public/icons/**", "public/favicon.ico", "package.json", "pnpm-lock.yaml", "deploy/package.json", "deploy/pnpm-lock.yaml"]
SPDX-FileCopyrightText = "dnitapado.es contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Self-hosted fonts (latin and latin-ext subsets from Fontsource 5.3.0), SIL Open Font License 1.1.
[[annotations]]
path = "src/ui/fonts/bricolage-grotesque-*.woff2"
SPDX-FileCopyrightText = "2022 The Bricolage Grotesque Project Authors (https://github.com/ateliertriay/bricolage)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/ui/fonts/jetbrains-mono-*.woff2"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/ui/fonts/caveat-*.woff2"
SPDX-FileCopyrightText = "2014 The Caveat Project Authors (https://github.com/googlefonts/caveat)"
SPDX-License-Identifier = "OFL-1.1"
